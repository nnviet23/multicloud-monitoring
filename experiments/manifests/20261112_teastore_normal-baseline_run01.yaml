schema_version: "1.0"
experiment_id: "20261112_teastore_normal-baseline_run01"
status: "incomplete" # planned | valid | invalid | incomplete
purpose: "Normal (fault-free) baseline for retraining the AI anomaly detector on the 4-cluster topology"
started_at_utc: "2026-11-12T10:25:18Z"
ended_at_utc: "2026-11-12T10:28:12Z"

repository:
  commit: "15219f97d3a10e9b0d5e00a2977c9082eb7dad01"
  branch: "AI"
  dirty: false  # only this run's experiment directories were untracked at start

workload:
  application: "TeaStore"
  version_or_image_digest: "descartesresearch/teastore-*:1.4.1 (digests in raw/20261112_teastore_normal-baseline_run01/system/pods_snapshot_start.json)"
  scenario: "normal-baseline"
  entrypoint: "http://localhost:8080/tools.descartes.teastore.webui (AWS nginx-api-gateway)"
  load_tool: "tests/locust/traffic_generator.py (stdlib generator used by scripts/run_data_collection.sh; not Locust)"
  load_tool_version: "15219f9:tests/locust/traffic_generator.py"
  concurrency: {min_users: 10, max_users: 50, profile: "4-phase daily curve + 15m/2m sine waves"}
  duration_seconds: 14400
  warmup_seconds: 0
  cooldown_seconds: 0
  fault_injection: none
  anomaly_label: 0

environment:
  clusters: ["hub-k3d", "aws-k3d", "azure-k3d", "gcp-k3d"]
  placement:
    aws-k3d: [nginx-api-gateway, teastore-webui, teastore-image, teastore-registry]
    azure-k3d: [teastore-auth, teastore-persistence, teastore-db]
    gcp-k3d: [teastore-recommender]
  node_profile: "k3s v1.31.2+k3s1, 1 server per cluster, single host 16 vCPU / 12.8 GiB RAM"
  resource_limits_snapshot: "raw/20261112_teastore_normal-baseline_run01/system/pods_snapshot_start.json"
  network_profile: "baseline"
  network_impairment:
    rtt_ms: 10        # tc netem delay per spoke egress (see system/netem_start.txt)
    jitter_ms: 2
    packet_loss_percent: 0.1
    bandwidth_mbps: null

telemetry:
  collector_version: "otel/opentelemetry-collector-contrib:0.114.0"
  java_agent: "autoinstrumentation-java:2.10.0, OTEL_METRIC_EXPORT_INTERVAL=10000"
  backend_versions: {prometheus: "v2.50.0", tempo: "2.4.0", loki: "2.9.4", thanos: "v0.36.1"}
  transport_security: "mtls"
  sampling_policy: "edge 20% traces + tail sampling at hub (metrics unsampled)"
  ai_feature_collector:
    script: "ai-engine/data/collector.py"
    prometheus: "svc/prometheus via kubectl port-forward, auto-restarted (system/port-forward.log)"
    interval_seconds: 10
    features: [qps, server_latency_p95, client_latency_p95, error_rate_5xx, max_pod_cpu_pct, max_pod_ram_pct, ram_floor_2m_pct, gc_pause_rate]
    cpu_definition: "% of one core from rate(jvm_cpu_time_seconds_total[1m]) (changed 2026-11-12)"
    ram_floor_window_seconds: 120

artifacts:
  raw:
    - "experiments/raw/20261112_teastore_normal-baseline_run01/metrics/entity_features.csv"
    - "experiments/raw/20261112_teastore_normal-baseline_run01/workload/traffic_generator.log"
  processed: []
  logs:
    - "experiments/raw/20261112_teastore_normal-baseline_run01/system/run.log"
    - "experiments/raw/20261112_teastore_normal-baseline_run01/system/collector.log"
    - "experiments/raw/20261112_teastore_normal-baseline_run01/system/port-forward.log"
  notes:
    - "experiments/raw/20261112_teastore_normal-baseline_run01/system/run_command.sh is the exact runner"

quality:
  validity_reason: "Stopped manually after ~170s of the planned 14400s (user request: pause collection and power off the lab). 17 cycles x 6 entities, 1402 requests, 0 failed. Too short to train on; keep as a smoke run of the 4-cluster pipeline."
  missing_data_notes:
    - "collector.py writes 0.0 when a PromQL query fails (no explicit missing marker); cross-check port-forward.log restarts before training"
  deviations:
    - "robusta-runner CrashLoopBackOff during the run (Kubernetes API 404); not on the telemetry path"
