---
- name: Deploy Distributed TeaStore Application Across Spoke Clusters
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # ---------------------------------------------
    # 1. AWS Cluster: WebUI, Auth, Cart
    # ---------------------------------------------
    - name: Ensure teastore namespace exists on AWS cluster
      command: kubectl --context k3d-aws-k3d create namespace teastore --dry-run=client -o yaml
      register: teastore_aws_ns
      changed_when: false

    - name: Apply teastore namespace on AWS cluster
      command: kubectl --context k3d-aws-k3d apply -f -
      args:
        stdin: "{{ teastore_aws_ns.stdout }}"

    - name: Deploy TeaStore Frontend Services on AWS cluster
      command: kubectl --context k3d-aws-k3d apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: teastore-webui
            namespace: teastore
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: teastore-webui
            template:
              metadata:
                labels:
                  app: teastore-webui
              spec:
                containers:
                - name: teastore-webui
                  image: descartesresearch/teastore-webui:latest
                  ports:
                  - containerPort: 8080
                  env:
                  - name: HOST_NAME
                    value: "teastore-webui"
                  - name: OTEL_SERVICE_NAME
                    value: "teastore-webui"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://otel-collector-spoke.monitoring.svc.cluster.local:4317"
                  - name: OTEL_EXPORTER_OTLP_INSECURE
                    value: "true"
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: teastore-webui
            namespace: teastore
          spec:
            type: LoadBalancer
            selector:
              app: teastore-webui
            ports:
            - port: 8080
              targetPort: 8080
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: teastore-auth
            namespace: teastore
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: teastore-auth
            template:
              metadata:
                labels:
                  app: teastore-auth
              spec:
                containers:
                - name: teastore-auth
                  image: descartesresearch/teastore-auth:latest
                  ports:
                  - containerPort: 8080
                  env:
                  - name: HOST_NAME
                    value: "teastore-auth"
                  - name: OTEL_SERVICE_NAME
                    value: "teastore-auth"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://otel-collector-spoke.monitoring.svc.cluster.local:4317"
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: teastore-auth
            namespace: teastore
          spec:
            type: ClusterIP
            selector:
              app: teastore-auth
            ports:
            - port: 8080
              targetPort: 8080

    # ---------------------------------------------
    # 2. AZURE Cluster: Persistence, Registry, Recommender
    # ---------------------------------------------
    - name: Ensure teastore namespace exists on Azure cluster
      command: kubectl --context k3d-azure-k3d create namespace teastore --dry-run=client -o yaml
      register: teastore_azure_ns
      changed_when: false

    - name: Apply teastore namespace on Azure cluster
      command: kubectl --context k3d-azure-k3d apply -f -
      args:
        stdin: "{{ teastore_azure_ns.stdout }}"

    - name: Deploy TeaStore Backend Services on Azure cluster
      command: kubectl --context k3d-azure-k3d apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: teastore-persistence
            namespace: teastore
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: teastore-persistence
            template:
              metadata:
                labels:
                  app: teastore-persistence
              spec:
                containers:
                - name: teastore-persistence
                  image: descartesresearch/teastore-persistence:latest
                  ports:
                  - containerPort: 8080
                  env:
                  - name: HOST_NAME
                    value: "teastore-persistence"
                  - name: OTEL_SERVICE_NAME
                    value: "teastore-persistence"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://otel-collector-spoke.monitoring.svc.cluster.local:4317"
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: teastore-persistence
            namespace: teastore
          spec:
            type: ClusterIP
            selector:
              app: teastore-persistence
            ports:
            - port: 8080
              targetPort: 8080