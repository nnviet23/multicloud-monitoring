      changed_when: false

    - name: Wait for TeaStore services on AWS Spoke to be ready
      command: kubectl --context k3d-aws-k3d -n teastore rollout status deployment/teastore-webui --timeout=680s
      changed_when: false

    - name: Generate initial HTTP traffic to TeaStore WebUI so Traces & Traced Logs appear immediately
      shell: |
        for i in 1 2 3 4 5; do
          curl -s -o /dev/null http://localhost:8080/tools.descartes.teastore.webui/ || true
          curl -s -o /dev/null http://localhost:8080/tools.descartes.teastore.webui/status || true
          sleep 2
        done
      changed_when: false

    - name: Confirm TeaStore deployment success
      debug:
