---
- name: Deploy OpenTelemetry Collector Agents on Spoke Clusters with mTLS and Optimization
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    spoke_contexts:
      - name: "aws"
        context: "k3d-aws-k3d"
        spoke_id: "aws-k3d"
      - name: "azure"
        context: "k3d-azure-k3d"
        spoke_id: "azure-k3d"
  tasks:
    - name: Apply Spoke OpenTelemetry Collector ConfigMap
      command: kubectl --context {{ item.context }} apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: otel-collector-spoke-config
            namespace: monitoring
          data:
            config.yaml: |
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
                    http:
                      endpoint: 0.0.0.0:4318

                hostmetrics:
                  collection_interval: 15s
                  scrapers:
                    cpu:
                    memory:
                    network:

                filelog:
                  include:
                    - /var/log/pods/teastore_*/*/*.log
                  start_at: beginning
                  include_file_path: true
                  operators:
                    - type: regex_parser
                      regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) (?P<log>.*)$'
                      timestamp:
                        parse_from: attributes.time
                        layout: '%Y-%m-%dT%H:%M:%S.%L%z'
                      output: extract_metadata_from_filepath
                    - type: regex_parser
                      id: extract_metadata_from_filepath
                      parse_from: attributes["log.file.path"]
                      regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_[a-f0-9\-]+/(?P<container_name>[^/]+)/.*$'
                      output: move_body
                    - type: move
                      id: move_body
                      from: attributes.log
                      to: body

              processors:
                memory_limiter:
                  check_interval: 1s
                  limit_percentage: 75
                  spike_limit_percentage: 20

                # Chuyển container_name và pod_name lên thành Resource Attributes để Loki hiển thị đúng service_name
                transform/logs:
                  error_mode: ignore
                  log_statements:
                    - context: log
                      statements:
                        - set(resource.attributes["service.name"], attributes["container_name"]) where attributes["container_name"] != nil
                        - set(resource.attributes["k8s.pod.name"], attributes["pod_name"]) where attributes["pod_name"] != nil
                        - set(resource.attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil

                # Chỉ lọc bỏ log nếu có gắn nhãn DEBUG rõ ràng (không xóa nhầm log có severity = 0)
                filter/logs:
                  error_mode: ignore
                  logs:
                    log_record:
                      - 'severity_number > 0 and severity_number < SEVERITY_NUMBER_INFO'

                # Lấy mẫu dấu vết Head-based ở mức 100%
                probabilistic_sampler:
                  sampling_percentage: 100

                # Gán nhãn nhận diện nguồn đám mây
                resource:
                  attributes:
                    - key: cloud.provider
                      value: "{{ item.name }}"
                      action: insert
                    - key: spoke_id
                      value: "{{ item.spoke_id }}"
                      action: insert

                batch:
                  send_batch_size: 512
                  timeout: 1s

              exporters:
                # Đẩy telemetry về Hub qua mTLS
                otlp/hub:
                  endpoint: k3d-hub-k3d-server-0:30317
                  tls:
                    ca_file: /etc/otelcol/certs/ca.crt
                    cert_file: /etc/otelcol/certs/client.crt
                    key_file: /etc/otelcol/certs/client.key
                    insecure_skip_verify: false

                debug:
                  verbosity: basic

              service:
                pipelines:
                  traces:
                    receivers: [otlp]
                    processors: [memory_limiter, probabilistic_sampler, resource, batch]
                    exporters: [otlp/hub, debug]
                  logs:
                    receivers: [otlp, filelog]
                    processors: [memory_limiter, transform/logs, filter/logs, resource, batch]
                    exporters: [otlp/hub, debug]
                  metrics:
                    receivers: [otlp, hostmetrics]
                    processors: [memory_limiter, resource, batch]
                    exporters: [otlp/hub, debug]
      loop: "{{ spoke_contexts }}"
      changed_when: false