---
- name: Expose Hub Services to Loadbalancer Ports
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Expose Grafana service to Loadbalancer port 3000
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc grafana -p
        '{"spec": {"type": "LoadBalancer", "ports": [{"name": "service", "port": 3000, "targetPort": 3000}]}}'
      changed_when: false

    - name: Expose Prometheus service to internal cluster
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc prometheus-server -p
        '{"spec": {"type": "ClusterIP"}}'
      changed_when: false