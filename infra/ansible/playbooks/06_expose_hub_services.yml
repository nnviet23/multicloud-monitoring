---
- name: Expose Hub Services to Loadbalancer Ports
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure Grafana service type is LoadBalancer
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc grafana -p
        '{"spec": {"type": "LoadBalancer"}}'
      changed_when: false

    - name: Ensure Prometheus service type is ClusterIP
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc prometheus-server -p
        '{"spec": {"type": "ClusterIP"}}'
      changed_when: false