---
- name: Expose Hub Services to Loadbalancer Ports
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure Grafana service listens on port 3000
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc grafana --type='json' -p='[
          {"op": "replace", "path": "/spec/type", "value": "LoadBalancer"},
          {"op": "replace", "path": "/spec/ports/0/port", "value": 3000}
        ]'
      changed_when: false

    - name: Ensure Prometheus service type is ClusterIP
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch svc prometheus-server -p
        '{"spec": {"type": "ClusterIP"}}'
      changed_when: false