---
- name: 00 - Clean up existing k3d clusters, Docker network, and volumes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    network_name: mc-monitoring-net
    pki_dir: "{{ playbook_dir }}/../../../security/pki"
  tasks:
    - name: Gracefully delete all k3d clusters
      command: k3d cluster delete --all
      register: k3d_del
      failed_when: false
      changed_when: false

    - name: Force remove any lingering k3d containers
      shell: |
        CONTAINERS=$(docker ps -a -q --filter "name=k3d-")
        if [ -n "$CONTAINERS" ]; then
          docker rm -f $CONTAINERS
        fi
      changed_when: false

    - name: Remove Docker bridge network
      command: docker network rm {{ network_name }}
      register: net_del
      failed_when: false
      changed_when: net_del.rc == 0

    - name: Prune dangling volumes
      command: docker volume prune -f
      changed_when: false

    - name: Clean up temporary generated certificates
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pki_dir }}/certs-hub"
        - "{{ pki_dir }}/certs-spoke1"
        - "{{ pki_dir }}/certs-spoke2"

    - name: Display cleanup summary
      debug:
        msg: "Cleaned up all k3d clusters, Docker containers, network {{ network_name }}, and generated certs successfully (Docker image cache preserved)."
