---
- name: Provision Multi-Cloud Simulated Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    network_name: multi-cloud-wan
    k3s_image: "rancher/k3s:v1.31.2-k3s1"
    clusters:
      - name: hub-k3d
        port_mappings:
          - "3000:3000@loadbalancer"
          - "9000:9000@loadbalancer"
          - "9001:9001@loadbalancer"
          - "4317:4317@loadbalancer"
          - "4318:4318@loadbalancer"
      - name: aws-k3d
        port_mappings:
          - "8080:8080@loadbalancer"
          - "31112:31112@loadbalancer"
      - name: azure-k3d
        port_mappings:
          - "31111:31111@loadbalancer"
          - "31114:31114@loadbalancer"
      - name: gcp-k3d
        port_mappings:
          - "31113:31113@loadbalancer"
  tasks:
    - name: Create Docker bridge network for inter-cluster traffic
      command: >
        docker network create --driver bridge
        --subnet 172.28.0.0/16
        {{ network_name }}
      register: net_create
      failed_when: net_create.rc != 0 and 'already exists' not in net_create.stderr
      changed_when: net_create.rc == 0

    - name: Check existing k3d clusters
      command: k3d cluster list -o json
      register: existing_clusters_raw
      changed_when: false

    - name: Parse existing cluster names
      set_fact:
        existing_clusters: "{{ (existing_clusters_raw.stdout | from_json) | map(attribute='name') | list }}"

    - name: Create k3d clusters with server-only mode (--agents 0)
      command: >
        k3d cluster create {{ item.name }}
        --image {{ k3s_image }}
        --network {{ network_name }}
        --agents 0
        --k3s-arg "--disable=traefik@server:0"
        --k3s-arg "--disable=metrics-server@server:0"
        {% for port in item.port_mappings %}
        -p "{{ port }}"
        {% endfor %}
      loop: "{{ clusters }}"
      when: item.name not in existing_clusters

    - name: Ensure reliable external DNS resolvers inside k3d server nodes (Cloudflare WARP / stub resolver compatibility)
      shell: |
        for node in k3d-hub-k3d-server-0 k3d-aws-k3d-server-0 k3d-azure-k3d-server-0 k3d-gcp-k3d-server-0; do
          docker exec "$node" sh -c 'printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 172.28.0.1\noptions ndots:0\n" > /etc/resolv.conf'
        done
      changed_when: false

    - name: Synchronize full Multi-Cloud WAN DNS records into CoreDNS NodeHosts across all clusters
      shell: |
        set -e
        NODE_HOSTS="172.28.0.1 host.k3d.internal"
        while read -r line; do
          if [ -n "$line" ]; then
            NODE_HOSTS=$(printf "%s\n%s" "$NODE_HOSTS" "$line")
          fi
        done <<EOF
        $(docker network inspect {{ network_name }} -f '{{ '{{' }}range .Containers{{ '}}' }}{{ '{{' }}.IPv4Address{{ '}}' }} {{ '{{' }}.Name{{ '}}' }}{{ '{{' }}"\n"{{ '}}' }}{{ '{{' }}end{{ '}}' }}' | sed 's|/16||g')
        EOF
        PATCH_JSON=$(python3 -c 'import json, sys; print(json.dumps({"data": {"NodeHosts": sys.stdin.read()}}))' <<< "$NODE_HOSTS")
        for ctx in k3d-hub-k3d k3d-aws-k3d k3d-azure-k3d k3d-gcp-k3d; do
          kubectl --context "$ctx" -n kube-system patch configmap coredns --type merge -p "$PATCH_JSON"
          kubectl --context "$ctx" -n kube-system rollout restart deployment/coredns
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: List active clusters
      command: k3d cluster list
      register: cluster_list
      changed_when: false

    - name: Display running clusters
      debug:
        var: cluster_list.stdout_lines