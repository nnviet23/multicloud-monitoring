---
- name: Provision Multi-Cloud Simulated Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    network_name: multi-cloud-wan
    k3s_image: "rancher/k3s:v1.31.2-k3s1"
    clusters:
      - name: hub-k3d
        port_mappings:
          - "3000:3000@loadbalancer"
          - "9000:9000@loadbalancer"
          - "9001:9001@loadbalancer"
          - "4317:4317@loadbalancer"
          - "4318:4318@loadbalancer"
      - name: aws-k3d
        port_mappings:
          - "8080:8080@loadbalancer"
      - name: azure-k3d
        port_mappings:
          - "31111:31111@loadbalancer"
  tasks:
    - name: Create Docker bridge network for inter-cluster traffic
      command: >
        docker network create --driver bridge
        --subnet 172.28.0.0/16
        {{ network_name }}
      register: net_create
      failed_when: net_create.rc != 0 and 'already exists' not in net_create.stderr
      changed_when: net_create.rc == 0

    - name: Check existing k3d clusters
      command: k3d cluster list -o json
      register: existing_clusters_raw
      changed_when: false

    - name: Parse existing cluster names
      set_fact:
        existing_clusters: "{{ (existing_clusters_raw.stdout | from_json) | map(attribute='name') | list }}"

    - name: Create k3d clusters with server-only mode (--agents 0)
      command: >
        k3d cluster create {{ item.name }}
        --image {{ k3s_image }}
        --network {{ network_name }}
        --agents 0
        --k3s-arg "--disable=traefik@server:0"
        --k3s-arg "--disable=metrics-server@server:0"
        {% for port in item.port_mappings %}
        -p "{{ port }}"
        {% endfor %}
      loop: "{{ clusters }}"
      when: item.name not in existing_clusters

    - name: List active clusters
      command: k3d cluster list
      register: cluster_list
      changed_when: false

    - name: Display running clusters
      debug:
        var: cluster_list.stdout_lines

    - name: Assign static IP addresses to cluster server nodes on multi-cloud-wan
      shell: |
        CURRENT_IP=$(docker inspect -f '{{ "{{" }}range .NetworkSettings.Networks{{ "}}" }}{{ "{{" }}.IPAddress{{ "}}" }}{{ "{{" }}end{{ "}}" }}' {{ item.container }})
        if [ "$CURRENT_IP" != "{{ item.ip }}" ]; then
          HOLDER=$(docker network inspect multi-cloud-wan --format '{{ "{{" }}range .Containers{{ "}}" }}{{ "{{" }}if eq .IPv4Address "{{ item.ip }}/16"{{ "}}" }}{{ "{{" }}.Name{{ "}}" }}{{ "{{" }}end{{ "}}" }}{{ "{{" }}end{{ "}}" }}')
          if [ -n "$HOLDER" ] && [ "$HOLDER" != "{{ item.container }}" ]; then
            docker network disconnect -f multi-cloud-wan "$HOLDER"
          fi
          docker network disconnect -f multi-cloud-wan {{ item.container }} 2>/dev/null || true
          docker network connect --ip {{ item.ip }} multi-cloud-wan {{ item.container }}
          if [ -n "$HOLDER" ] && [ "$HOLDER" != "{{ item.container }}" ]; then
            docker network connect multi-cloud-wan "$HOLDER"
          fi
        fi
      loop:
        - { container: "k3d-hub-k3d-server-0", ip: "172.28.0.10" }
        - { container: "k3d-aws-k3d-server-0", ip: "172.28.0.20" }
        - { container: "k3d-azure-k3d-server-0", ip: "172.28.0.30" }
      changed_when: false