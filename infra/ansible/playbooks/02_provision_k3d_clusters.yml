---
- name: 02 - Provision Multi-Cloud Simulated Infrastructure (k3d Clusters)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    network_name: mc-monitoring-net
    network_subnet: 172.28.0.0/16
    k3s_image: "rancher/k3s:v1.31.2-k3s1"
    clusters:
      - name: hub-k3d
        port_mappings:
          - "3000:3000@loadbalancer"
          - "9000:9000@loadbalancer"
          - "9001:9001@loadbalancer"
          - "4317:4317@loadbalancer"
          - "4318:4318@loadbalancer"
      - name: aws-k3d
        port_mappings:
          - "8080:8080@loadbalancer"
          - "8089:8089@loadbalancer"
      - name: azure-k3d
        port_mappings:
          - "31111:31111@loadbalancer"

  tasks:
    - name: Create dedicated Docker bridge network for inter-cluster simulated WAN
      command: >
        docker network create --driver bridge
        --subnet {{ network_subnet }}
        {{ network_name }}
      register: net_create
      failed_when: net_create.rc != 0 and 'already exists' not in net_create.stderr
      changed_when: net_create.rc == 0

    - name: Query existing k3d clusters
      command: k3d cluster list -o json
      register: existing_clusters_raw
      changed_when: false

    - name: Parse existing cluster names
      set_fact:
        existing_clusters: "{{ (existing_clusters_raw.stdout | from_json) | map(attribute='name') | list }}"

    - name: Provision k3d clusters with server-only mode (--agents 0)
      command: >
        k3d cluster create {{ item.name }}
        --image {{ k3s_image }}
        --network {{ network_name }}
        --agents 0
        --k3s-arg "--disable=traefik@server:0"
        --k3s-arg "--disable=metrics-server@server:0"
        {% for port in item.port_mappings %}
        -p "{{ port }}"
        {% endfor %}
      loop: "{{ clusters }}"
      when: item.name not in existing_clusters

    - name: Wait for Kubernetes nodes to report Ready
      command: kubectl --context k3d-{{ item.name }} wait --for=condition=Ready node --all --timeout=120s
      loop: "{{ clusters }}"
      register: nodes_ready
      changed_when: false

    - name: List active k3d clusters and nodes
      command: k3d cluster list
      register: active_clusters
      changed_when: false

    - name: Display cluster status
      debug:
        msg: "{{ active_clusters.stdout_lines }}"

