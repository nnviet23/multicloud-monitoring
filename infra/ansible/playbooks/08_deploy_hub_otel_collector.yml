---
- name: Deploy OpenTelemetry Collector Gateway on Hub Cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply Hub OpenTelemetry Collector ConfigMap
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: otel-collector-hub-config
            namespace: monitoring
          data:
            config.yaml: |
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
                    http:
                      endpoint: 0.0.0.0:4318

              processors:
                batch:
                  timeout: 1s
                  send_batch_size: 256
                memory_limiter:
                  check_interval: 1s
                  limit_percentage: 75
                  spike_limit_percentage: 20

              exporters:
                otlp/tempo:
                  endpoint: tempo.monitoring.svc.cluster.local:4317
                  tls:
                    insecure: true

                loki:
                  endpoint: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
                  headers:
                    "X-Scope-OrgID": "anonymous"

                prometheus:
                  endpoint: 0.0.0.0:8889

                debug:
                  verbosity: basic

              service:x
                pipelines:
                  traces:
                    receivers: [otlp]
                    processors: [memory_limiter, batch]
                    exporters: [otlp/tempo, debug]
                  logs:
                    receivers: [otlp]
                    processors: [memory_limiter, batch]
                    exporters: [loki, debug]
                  metrics:
                    receivers: [otlp]
                    processors: [memory_limiter, batch]
                    exporters: [prometheus, debug]

    - name: Deploy Hub OpenTelemetry Collector Deployment and Service
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: otel-collector-hub
            namespace: monitoring
            labels:
              app: otel-collector-hub
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: otel-collector-hub
            template:
              metadata:
                labels:
                  app: otel-collector-hub
              spec:
                containers:
                - name: otel-collector
                  image: otel/opentelemetry-collector-contrib:0.111.0
                  imagePullPolicy: IfNotPresent
                  args: ["--config=/etc/otelcol/config.yaml"]
                  volumeMounts:
                  - name: config
                    mountPath: /etc/otelcol
                  ports:
                  - containerPort: 4317
                    name: otlp-grpc
                  - containerPort: 4318
                    name: otlp-http
                  - containerPort: 8889
                    name: metrics
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                volumes:
                - name: config
                  configMap:
                    name: otel-collector-hub-config
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: otel-collector-hub
            namespace: monitoring
          spec:
            type: LoadBalancer
            selector:
              app: otel-collector-hub
            ports:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
            - name: otlp-http
              port: 4318
              targetPort: 4318
            - name: metrics
              port: 8889
              targetPort: 8889