---
- name: Configure Grafana Data Sources for Monitoring Stack
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply Grafana Data Sources ConfigMap
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources
            namespace: monitoring
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  jsonData:
                    timeInterval: 15s

                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-gateway.monitoring.svc.cluster.local
                  jsonData:
                    maxLines: 1000

                - name: Tempo
                  type: tempo
                  access: proxy
                  url: http://tempo.monitoring.svc.cluster.local:3100
                  jsonData:
                    tracesToLogs:
                      datasourceUid: 'Loki'
                      filterByTraceId: true

    - name: Mount Data Sources ConfigMap into Grafana Deployment
      command: >
        kubectl --context k3d-hub-k3d -n monitoring patch deployment grafana -p
        '{"spec": {"template": {"spec": {"volumes": [{"name": "sc-datasources-volume", "configMap": {"name": "grafana-datasources"}}], "containers": [{"name": "grafana", "volumeMounts": [{"name": "sc-datasources-volume", "mountPath": "/etc/grafana/provisioning/datasources/datasources.yaml", "subPath": "datasources.yaml"}]}]}}}}'
      changed_when: false

    - name: Restart Grafana to reload provisioning
      command: kubectl --context k3d-hub-k3d -n monitoring rollout restart deployment grafana
      changed_when: false