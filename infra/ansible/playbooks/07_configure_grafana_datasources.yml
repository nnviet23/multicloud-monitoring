---
- name: Configure Grafana Data Sources for Monitoring Stack
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply Grafana Data Sources ConfigMap
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources
            namespace: monitoring
            labels:
              grafana_datasource: "1"
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  jsonData:
                    timeInterval: 15s

                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-gateway.monitoring.svc.cluster.local
                  jsonData:
                    maxLines: 1000

                - name: Tempo
                  type: tempo
                  access: proxy
                  url: http://tempo.monitoring.svc.cluster.local:3100
                  jsonData:
                    tracesToLogs:
                      datasourceUid: 'Loki'
                      filterByTraceId: true

    - name: Link ConfigMap to Grafana deployment sidecar
      command: >
        helm upgrade --install grafana grafana/grafana
        --kube-context k3d-hub-k3d
        --namespace monitoring
        --reuse-values
        --set sidecar.datasources.enabled=true
        --set sidecar.datasources.label=grafana_datasource