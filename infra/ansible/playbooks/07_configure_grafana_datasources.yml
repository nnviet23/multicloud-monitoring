---
- name: Configure Grafana Data Sources for Monitoring Stack
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply Grafana Data Sources ConfigMap
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources
            namespace: monitoring
            labels:
              grafana_datasource: "1"
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  jsonData:
                    timeInterval: 15s

                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-gateway.monitoring.svc.cluster.local
                  jsonData:
                    maxLines: 1000
                    httpHeaderName1: "X-Scope-OrgID"
                  secureJsonData:
                    httpHeaderValue1: "anonymous"

                - name: Tempo
                  type: tempo
                  access: proxy
                  url: http://tempo.monitoring.svc.cluster.local:3200
                  jsonData:
                    tracesToLogs:
                      datasourceUid: 'Loki'
                      filterByTraceId: true

    - name: Wait for Grafana port to be responsive
      wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 60

    - name: Update Tempo Data Source via REST API
      uri:
        url: "http://127.0.0.1:3000/api/datasources/name/Tempo"
        method: PUT
        url_username: admin
        url_password: admin
        force_basic_auth: true
        status_code: [200, 404]
        body_format: json
        body:
          name: "Tempo"
          type: "tempo"
          access: "proxy"
          url: "http://tempo.monitoring.svc.cluster.local:3200"
          jsonData:
            tracesToLogs:
              datasourceUid: "Loki"
              filterByTraceId: true