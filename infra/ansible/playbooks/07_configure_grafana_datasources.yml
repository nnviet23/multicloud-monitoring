---
- name: Configure Grafana Data Sources for Monitoring Stack
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Wait for Grafana port to be responsive
      wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 60

    - name: Create or Update Prometheus Data Source
      uri:
        url: "http://127.0.0.1:3000/api/datasources"
        method: POST
        url_username: admin
        url_password: admin
        force_basic_auth: true
        status_code: [200, 409]
        body_format: json
        body:
          name: "Prometheus"
          type: "prometheus"
          access: "proxy"
          url: "http://prometheus-server.monitoring.svc.cluster.local"
          isDefault: true
          jsonData:
            timeInterval: "15s"

    - name: Create or Update Loki Data Source
      uri:
        url: "http://127.0.0.1:3000/api/datasources"
        method: POST
        url_username: admin
        url_password: admin
        force_basic_auth: true
        status_code: [200, 409]
        body_format: json
        body:
          name: "Loki"
          type: "loki"
          access: "proxy"
          url: "http://loki-gateway.monitoring.svc.cluster.local"
          jsonData:
            maxLines: 1000

    - name: Create or Update Tempo Data Source
      uri:
        url: "http://127.0.0.1:3000/api/datasources"
        method: POST
        url_username: admin
        url_password: admin
        force_basic_auth: true
        status_code: [200, 409]
        body_format: json
        body:
          name: "Tempo"
          type: "tempo"
          access: "proxy"
          url: "http://tempo.monitoring.svc.cluster.local:3100"
          jsonData:
            tracesToLogs:
              datasourceUid: "Loki"
              filterByTraceId: true