---
- name: Deploy Grafana and Auto-Provision Observability Data Sources
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply Grafana Datasources Provisioning ConfigMap
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources
            namespace: monitoring
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  uid: prometheus-ds
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  jsonData:
                    timeInterval: 15s

                - name: Loki
                  uid: loki-ds
                  type: loki
                  access: proxy
                  url: http://loki.monitoring.svc.cluster.local:3100
                  jsonData:
                    maxLines: 1000
                    httpHeaderName1: "X-Scope-OrgID"
                    derivedFields:
                      - datasourceUid: tempo-ds
                        matcherRegex: "(?:traceID|trace_id)=(\\w+)"
                        name: TraceID
                        url: "$${__value.raw}"
                  secureJsonData:
                    httpHeaderValue1: "anonymous"

                - name: Tempo
                  uid: tempo-ds
                  type: tempo
                  access: proxy
                  url: http://tempo.monitoring.svc.cluster.local:3100
                  jsonData:
                    httpMethod: GET
                    tracesToLogsV2:
                      datasourceUid: loki-ds
                      tags: ['job', 'instance', 'pod', 'namespace']
                      filterByTraceId: true

    - name: Deploy Grafana via Manifest (Lightweight & Standalone)
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: grafana
            namespace: monitoring
            labels:
              app: grafana
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: grafana
            template:
              metadata:
                labels:
                  app: grafana
              spec:
                containers:
                - name: grafana
                  image: grafana/grafana:11.5.0
                  imagePullPolicy: IfNotPresent
                  env:
                  - name: GF_SECURITY_ADMIN_USER
                    value: "admin"
                  - name: GF_SECURITY_ADMIN_PASSWORD
                    value: "admin"
                  - name: GF_USERS_ALLOW_SIGN_UP
                    value: "false"
                  ports:
                  - containerPort: 3000
                    name: http
                  volumeMounts:
                  - name: datasources
                    mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
                    subPath: datasources.yaml
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 256Mi
                volumes:
                - name: datasources
                  configMap:
                    name: grafana-datasources
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: grafana
            namespace: monitoring
          spec:
            type: LoadBalancer
            selector:
              app: grafana
            ports:
            - port: 3000
              targetPort: 3000

    - name: Wait for Grafana deployment to roll out
      command: kubectl --context k3d-hub-k3d -n monitoring rollout status deployment/grafana --timeout=120s
      changed_when: false

    - name: Verify Grafana Port Accessibility
      debug:
        msg: "Grafana is running at http://localhost:3000 (User: admin / Pass: admin)"