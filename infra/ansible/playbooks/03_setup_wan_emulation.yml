---
- name: Emulate Cross-Cloud WAN Network Characteristics
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    latency: 10ms
    loss: 0.1%
    spoke_containers:
      - k3d-aws-k3d-server-0
      - k3d-aws-k3d-agent-0
      - k3d-azure-k3d-server-0
      - k3d-azure-k3d-agent-0
  tasks:
    - name: Apply tc netem latency and packet loss inside spoke containers
      become: true
      command: >
        docker exec --privileged {{ item }} 
        tc qdisc replace dev eth0 root netem delay {{ latency }} loss {{ loss }}
      loop: "{{ spoke_containers }}"
      register: tc_exec
      failed_when: false
      changed_when: tc_exec.rc == 0

    - name: Verify tc qdisc configuration in spoke containers
      command: docker exec {{ item }} tc qdisc show dev eth0
      loop: "{{ spoke_containers }}"
      register: tc_status
      failed_when: false
      changed_when: false

    - name: Display current queue discipline status
      debug:
        msg: "{{ item.item }}: {{ item.stdout }}"
      loop: "{{ tc_status.results }}"
      when: item.stdout is defined