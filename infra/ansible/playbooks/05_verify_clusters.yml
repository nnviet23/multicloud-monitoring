---
- name: 05 - Verify Multi-Cluster Connectivity, DNS, and Health
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    clusters:
      - name: hub-k3d
        context: k3d-hub-k3d
        container: k3d-hub-k3d-server-0
      - name: aws-k3d
        context: k3d-aws-k3d
        container: k3d-aws-k3d-server-0
      - name: azure-k3d
        context: k3d-azure-k3d
        container: k3d-azure-k3d-server-0

  tasks:
    - name: Check node status for each cluster
      command: kubectl --context {{ item.context }} get nodes -o wide
      loop: "{{ clusters }}"
      register: node_status
      changed_when: false

    - name: Display node status
      debug:
        msg: "Cluster {{ item.item.name }}: {{ item.stdout_lines }}"
      loop: "{{ node_status.results }}"

    - name: Verify CoreDNS and system pods in kube-system
      command: kubectl --context {{ item.context }} -n kube-system get pods
      loop: "{{ clusters }}"
      register: sys_pods
      changed_when: false

    - name: Display system pod status
      debug:
        msg: "Cluster {{ item.item.name }}: {{ item.stdout_lines }}"
      loop: "{{ sys_pods.results }}"

    - name: Verify inter-cluster reachability via Docker WAN network
      command: >
        docker exec k3d-aws-k3d-server-0 ping -c 3 -W 2 {{ item.container }}
      loop:
        - { container: "k3d-hub-k3d-server-0" }
        - { container: "k3d-azure-k3d-server-0" }
      register: ping_test
      changed_when: false

    - name: Display inter-cluster ping results
      debug:
        msg: "Ping to {{ item.item.container }}: rtt/loss stats -> {{ item.stdout_lines[-1] }}"
      loop: "{{ ping_test.results }}"

    - name: Confirm Phase 1 infrastructure verification
      debug:
        msg: "All 3 k3d clusters are provisioned, Healthy, interconnected via mc-monitoring-net, and WAN latency emulation is active."

