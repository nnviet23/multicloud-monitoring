---
- name: Deploy MinIO Object Storage and Buckets on Hub
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    minio_image: "cgr.dev/chainguard/minio:latest"
  tasks:
    - name: Ensure monitoring namespace exists on Hub
      command: kubectl --context k3d-hub-k3d create namespace monitoring --dry-run=client -o yaml
      register: hub_ns
      changed_when: false

    - name: Apply monitoring namespace on Hub
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: "{{ hub_ns.stdout }}"

    - name: Pull MinIO image on Docker host before importing
      command: docker pull {{ minio_image }}
      changed_when: false

    - name: Import MinIO image into k3d Hub cluster
      command: k3d image import {{ minio_image }} -c hub-k3d
      changed_when: false

    - name: Deploy MinIO Server
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: monitoring
            labels:
              app: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                - name: minio
                  image: {{ minio_image }}
                  imagePullPolicy: IfNotPresent
                  args:
                  - server
                  - /data
                  - --console-address
                  - :9001
                  env:
                  - name: MINIO_ROOT_USER
                    value: "admin"
                  - name: MINIO_ROOT_PASSWORD
                    value: "StrongMinioPassword123"
                  ports:
                  - containerPort: 9000
                    name: api
                  - containerPort: 9001
                    name: console
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 384Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: monitoring
          spec:
            type: LoadBalancer
            selector:
              app: minio
            ports:
            - name: api
              port: 9000
              targetPort: 9000
            - name: console
              port: 9001
              targetPort: 9001

    - name: Wait for MinIO deployment to be ready
      command: kubectl --context k3d-hub-k3d -n monitoring rollout status deployment/minio --timeout=90s
      changed_when: false

    - name: Provision MinIO Buckets (thanos-metrics, loki-data, tempo-traces)
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: minio-create-buckets
            namespace: monitoring
          spec:
            ttlSecondsAfterFinished: 60
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                - name: minio-mc
                  image: minio/mc:latest
                  command:
                  - /bin/sh
                  - -c
                  - |
                    until mc alias set myminio http://minio.monitoring.svc.cluster.local:9000 admin StrongMinioPassword123; do
                      echo 'Waiting for MinIO...';
                      sleep 2;
                    done;
                    mc mb --ignore-existing myminio/thanos-metrics;
                    mc mb --ignore-existing myminio/loki-data;
                    mc mb --ignore-existing myminio/tempo-traces;
                    echo 'Buckets created successfully!';
                    
    - name: Restart k3d servers and loadbalancers to refresh network state and DNS cache
      command: >
        docker restart
        k3d-hub-k3d-server-0 k3d-hub-k3d-serverlb
        k3d-aws-k3d-server-0 k3d-aws-k3d-serverlb
        k3d-azure-k3d-server-0 k3d-azure-k3d-serverlb
      changed_when: false

    - name: Wait for Kubernetes API servers to be responsive
      command: kubectl --context {{ item }} get nodes
      register: api_check
      until: api_check.rc == 0
      retries: 15
      delay: 3
      loop:
        - k3d-hub-k3d
        - k3d-aws-k3d
        - k3d-azure-k3d
      changed_when: false