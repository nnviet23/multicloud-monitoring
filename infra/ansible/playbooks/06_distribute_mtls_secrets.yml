---
- name: 06 - Distribute mTLS Certificates as Kubernetes Secrets across Hub and Spokes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pki_dir: "{{ playbook_dir }}/../../../security/pki"

  tasks:
    - name: Ensure monitoring namespace exists on Hub
      command: kubectl --context k3d-hub-k3d create namespace monitoring --dry-run=client -o yaml
      register: hub_ns
      changed_when: false

    - name: Apply monitoring namespace on Hub
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: "{{ hub_ns.stdout }}"

    - name: Ensure monitoring namespace exists on Spoke 1 (AWS)
      command: kubectl --context k3d-aws-k3d create namespace monitoring --dry-run=client -o yaml
      register: aws_ns
      changed_when: false

    - name: Apply monitoring namespace on Spoke 1 (AWS)
      command: kubectl --context k3d-aws-k3d apply -f -
      args:
        stdin: "{{ aws_ns.stdout }}"

    - name: Ensure monitoring namespace exists on Spoke 2 (Azure)
      command: kubectl --context k3d-azure-k3d create namespace monitoring --dry-run=client -o yaml
      register: azure_ns
      changed_when: false

    - name: Apply monitoring namespace on Spoke 2 (Azure)
      command: kubectl --context k3d-azure-k3d apply -f -
      args:
        stdin: "{{ azure_ns.stdout }}"

    - name: Ensure monitoring namespace exists on Spoke 3 (GCP)
      command: kubectl --context k3d-gcp-k3d create namespace monitoring --dry-run=client -o yaml
      register: gcp_ns
      changed_when: false

    - name: Apply monitoring namespace on Spoke 3 (GCP)
      command: kubectl --context k3d-gcp-k3d apply -f -
      args:
        stdin: "{{ gcp_ns.stdout }}"

    - name: Create otel-hub-certs secret on Hub cluster
      command: >
        kubectl --context k3d-hub-k3d -n monitoring create secret generic otel-hub-certs
        "--from-file=server.crt={{ pki_dir }}/certs-hub/server.crt"
        "--from-file=server.key={{ pki_dir }}/certs-hub/server.key"
        "--from-file=ca.crt={{ pki_dir }}/ca/ca.crt"
        --dry-run=client -o yaml
      register: hub_secret_yaml
      changed_when: false

    - name: Apply otel-hub-certs secret on Hub
      command: kubectl --context k3d-hub-k3d apply -f -
      args:
        stdin: "{{ hub_secret_yaml.stdout }}"

    - name: Create otel-spoke-certs secret on Spoke 1 (AWS)
      command: >
        kubectl --context k3d-aws-k3d -n monitoring create secret generic otel-spoke-certs
        "--from-file=client.crt={{ pki_dir }}/certs-spoke1/client.crt"
        "--from-file=client.key={{ pki_dir }}/certs-spoke1/client.key"
        "--from-file=ca.crt={{ pki_dir }}/ca/ca.crt"
        --dry-run=client -o yaml
      register: aws_secret_yaml
      changed_when: false

    - name: Apply otel-spoke-certs secret on Spoke 1
      command: kubectl --context k3d-aws-k3d apply -f -
      args:
        stdin: "{{ aws_secret_yaml.stdout }}"

    - name: Create otel-spoke-certs secret on Spoke 2 (Azure)
      command: >
        kubectl --context k3d-azure-k3d -n monitoring create secret generic otel-spoke-certs
        "--from-file=client.crt={{ pki_dir }}/certs-spoke2/client.crt"
        "--from-file=client.key={{ pki_dir }}/certs-spoke2/client.key"
        "--from-file=ca.crt={{ pki_dir }}/ca/ca.crt"
        --dry-run=client -o yaml
      register: azure_secret_yaml
      changed_when: false

    - name: Apply otel-spoke-certs secret on Spoke 2
      command: kubectl --context k3d-azure-k3d apply -f -
      args:
        stdin: "{{ azure_secret_yaml.stdout }}"

    - name: Create otel-spoke-certs secret on Spoke 3 (GCP)
      command: >
        kubectl --context k3d-gcp-k3d -n monitoring create secret generic otel-spoke-certs
        "--from-file=client.crt={{ pki_dir }}/certs-spoke3/client.crt"
        "--from-file=client.key={{ pki_dir }}/certs-spoke3/client.key"
        "--from-file=ca.crt={{ pki_dir }}/ca/ca.crt"
        --dry-run=client -o yaml
      register: gcp_secret_yaml
      changed_when: false

    - name: Apply otel-spoke-certs secret on Spoke 3
      command: kubectl --context k3d-gcp-k3d apply -f -
      args:
        stdin: "{{ gcp_secret_yaml.stdout }}"

    - name: Display distribution completion
      debug:
        msg: "mTLS secrets (otel-hub-certs, otel-spoke-certs) distributed across hub-k3d, aws-k3d, azure-k3d, and gcp-k3d successfully."
