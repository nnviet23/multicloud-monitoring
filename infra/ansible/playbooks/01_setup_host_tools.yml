---
- name: 01 - Verify and Setup Host Tools Environment
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Check prerequisite command line tools
      command: which {{ item }}
      loop:
        - docker
        - k3d
        - kubectl
        - helm
      register: tool_check
      failed_when: tool_check.rc != 0
      changed_when: false

    - name: Capture tool versions
      shell: |
        echo "=== Docker ===" && docker --version
        echo "=== k3d ===" && k3d version
        echo "=== kubectl ===" && kubectl version --client --output=yaml | head -n 5
        echo "=== helm ===" && helm version --short
      register: tool_versions
      changed_when: false

    - name: Display verified host environment
      debug:
        msg: "{{ tool_versions.stdout_lines }}"

