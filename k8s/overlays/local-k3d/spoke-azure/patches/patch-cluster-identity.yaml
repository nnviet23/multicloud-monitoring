apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-spoke
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: otel-collector
          env:
            - name: CLUSTER_NAME
              value: "azure-k3d"
            - name: CLOUD_PROVIDER
              value: "azure"
            - name: CLOUD_REGION
              value: "southasia"

