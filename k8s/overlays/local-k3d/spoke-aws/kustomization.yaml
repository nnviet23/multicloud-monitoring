apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Spoke 1 - AWS (Edge Gateway, Storefront & Media)
#   nginx-api-gateway (public :8080), teastore-webui, teastore-image, teastore-registry
#   teastore-auth -> azure-k3d, teastore-recommender -> gcp-k3d
resources:
  - ../../../base/teastore/namespace
  - ../../../base/teastore/registry
  - ../../../base/teastore/image-provider
  - ../../../base/teastore/webui
  - ../../../base/teastore/api-gateway
  - ../../../base/otel-collector/edge

patches:
  - path: patches/patch-cluster-identity.yaml
  - path: patches/patch-webui-service-internal.yaml
