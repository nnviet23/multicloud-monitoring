apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'k8s_cluster_name', 'service_name']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'robusta-webhook'

    receivers:
    - name: 'robusta-webhook'
      webhook_configs:
      - url: 'http://robusta-runner.monitoring.svc.cluster.local:5000/api/alerts'
        send_resolved: true
