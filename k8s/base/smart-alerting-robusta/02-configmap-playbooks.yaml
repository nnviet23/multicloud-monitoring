apiVersion: v1
kind: ConfigMap
metadata:
  name: robusta-config
  namespace: monitoring
data:
  active_playbooks.yaml: |
    global_config:
      cluster_name: hub-k3d
      prometheus_url: "http://thanos-query.monitoring.svc.cluster.local:9090"

    playbook_repos: {}

    sinks_config:
      - telegram_sink:
          name: main_telegram_sink
          bot_token: "{{ env.TELEGRAM_BOT_TOKEN }}"
          chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
          send_files: true

    custom_playbooks:
      - name: "AIOps Anomaly Alert Enrichment"
        triggers:
          - on_prometheus_alert:
              alert_name: AIOpsAnomalyDetected
        actions:
          - customize_alert:
              title: "🚨 [AIOps Anomaly] {{ alert.labels.service_name }} ({{ alert.labels.cloud_provider }} / {{ alert.labels.k8s_cluster_name }})"
          - logs_enricher: {}

      - name: "Pod Crash Loop Enrichment"
        triggers:
          - on_pod_crash_loop: {}
        actions:
          - report_crash_loop: {}
          - pod_events_enricher: {}

      - name: "Pod OOM Killed Investigation"
        triggers:
          - on_pod_oom_killed: {}
        actions:
          - node_allocatable_resources_enricher: {}
          - pod_events_enricher: {}
