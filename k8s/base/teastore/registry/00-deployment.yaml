apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  labels:
    app: teastore-registry
    tier: compute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teastore-registry
  template:
    metadata:
      labels:
        app: teastore-registry
        tier: compute
    spec:
      initContainers:
        - name: opentelemetry-auto-instrumentation
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.10.0
          imagePullPolicy: IfNotPresent
          command: ["cp", "/javaagent.jar", "/otel-auto-instrumentation/javaagent.jar"]
          volumeMounts:
            - name: otel-auto-instrumentation
              mountPath: /otel-auto-instrumentation
      containers:
        - name: teastore-registry
          image: descartesresearch/teastore-registry:1.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: HOST_NAME
              value: "teastore-registry"
            - name: CATALINA_OPTS
              value: "-javaagent:/otel-auto-instrumentation/javaagent.jar -Dkieker.monitoring.skipDefaultAOPConfiguration=true -Xms96m -Xmx256m -XX:+UseSerialGC"
            - name: OTEL_SERVICE_NAME
              value: "teastore-registry"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-spoke.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: otel-auto-instrumentation
              mountPath: /otel-auto-instrumentation
          startupProbe:
            httpGet:
              path: /tools.descartes.teastore.registry/rest/services/isalive
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /tools.descartes.teastore.registry/rest/services/isalive
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tools.descartes.teastore.registry/rest/services/isalive
              port: 8080
            periodSeconds: 15
      volumes:
        - name: otel-auto-instrumentation
          emptyDir: {}

