apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-auth
  labels:
    app: teastore-auth
    tier: compute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teastore-auth
  template:
    metadata:
      labels:
        app: teastore-auth
        tier: compute
    spec:
      initContainers:
        - name: opentelemetry-auto-instrumentation
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.10.0
          imagePullPolicy: IfNotPresent
          command: ["cp", "/javaagent.jar", "/otel-auto-instrumentation/javaagent.jar"]
          volumeMounts:
            - name: otel-auto-instrumentation
              mountPath: /otel-auto-instrumentation
      containers:
        - name: teastore-auth
          image: descartesresearch/teastore-auth:1.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: REGISTRY_HOST
              value: "teastore-registry.teastore.svc.cluster.local"
            - name: REGISTRY_PORT
              value: "8080"
            - name: USE_POD_IP
              value: "true"
            - name: CATALINA_OPTS
              value: "-javaagent:/otel-auto-instrumentation/javaagent.jar -Dkieker.monitoring.skipDefaultAOPConfiguration=true -Xms96m -Xmx256m -XX:+UseSerialGC"
            - name: OTEL_SERVICE_NAME
              value: "teastore-auth"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-spoke.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: otel-auto-instrumentation
              mountPath: /otel-auto-instrumentation
          startupProbe:
            httpGet:
              path: /tools.descartes.teastore.auth/rest/ready/isready
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /tools.descartes.teastore.auth/rest/ready/isready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /tools.descartes.teastore.auth/rest/ready/isready
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: otel-auto-instrumentation
          emptyDir: {}

