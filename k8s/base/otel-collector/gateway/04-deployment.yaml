apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-hub
  namespace: monitoring
  labels:
    app: otel-collector-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-hub
  template:
    metadata:
      labels:
        app: otel-collector-hub
    spec:
      serviceAccountName: otel-collector-hub
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          envFrom:
            - secretRef:
                name: loki-s3-creds
          env:
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: certs
              mountPath: /etc/otelcol/certs
              readOnly: true
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-hub-config
        - name: certs
          secret:
            secretName: otel-hub-certs
