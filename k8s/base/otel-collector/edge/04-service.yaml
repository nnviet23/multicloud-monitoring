apiVersion: v1
kind: Service
metadata:
  name: otel-collector-spoke
  namespace: monitoring
  labels:
    app: otel-collector-spoke
spec:
  type: ClusterIP
  selector:
    app: otel-collector-spoke
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889

