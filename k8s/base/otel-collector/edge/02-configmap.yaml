apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-spoke-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      hostmetrics:
        collection_interval: 15s
        scrapers:
          cpu:
          load:
          memory:
          paging:
          disk:
          filesystem:
          network:

      filelog:
        include:
          - /var/log/pods/teastore_*/*/*.log
        start_at: beginning
        include_file_path: true
        operators:
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) (?P<log>.*)$'
            output: extract_metadata_from_filepath
          - type: regex_parser
            id: extract_metadata_from_filepath
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_[a-f0-9\-]+/(?P<container_name>[^/]+)/.*$'
            output: move_body
          - type: move
            id: move_body
            from: attributes.log
            to: body

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      filter/drop_noise:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(attributes["url.path"], ".*/isready.*")'
            - 'IsMatch(attributes["url.path"], ".*/finished.*")'
            - 'IsMatch(attributes["http.target"], ".*/status.*")'
        logs:
          log_record:
            - 'IsMatch(body, ".*GET /ready/isready.*200.*")'
            - 'IsMatch(body, ".*GET /image/finished.*200.*")'

      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false

      filter/logs:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number > 0 and severity_number < SEVERITY_NUMBER_INFO'

      probabilistic_sampler:
        sampling_percentage: 20

      groupbyattrs:
        keys:
          - container_name
          - pod_name
          - namespace

      transform/logs:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["container_name"]) where attributes["service.name"] == nil and attributes["container_name"] != nil
              - set(attributes["k8s.pod.name"], attributes["pod_name"]) where attributes["pod_name"] != nil
              - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil

      transform/cluster_id:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")
        trace_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")
        metric_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")

      batch:
        send_batch_size: 512
        timeout: 1s

    exporters:
      otlp/hub:
        endpoint: k3d-hub-k3d-server-0:4317
        tls:
          ca_file: /etc/otelcol/certs/ca.crt
          cert_file: /etc/otelcol/certs/client.crt
          key_file: /etc/otelcol/certs/client.key
          insecure_skip_verify: false

      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_noise, resourcedetection, probabilistic_sampler, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, filter/logs, filter/drop_noise, resourcedetection, groupbyattrs, transform/logs, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, resourcedetection, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
