apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 01-configmap-prometheus.yaml
  - 01-configmap-prometheus-rules.yaml
  - 02-pvc.yaml
  - 03-statefulset-prometheus.yaml
  - 04-service-prometheus.yaml
  - 05-deployment-thanos-query.yaml
  - 06-service-thanos-query.yaml

secretGenerator:
  - name: thanos-objstore-secret
    namespace: monitoring
    files:
      - objstore.yml
    options:
      disableNameSuffixHash: true
