apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s

    compactor:
      compaction:
        compaction_cycle: 1m
        compaction_window: 1h
        block_retention: 24h

    storage:
      trace:
        backend: s3
        wal:
          path: /var/tempo/wal
        s3:
          bucket: tempo-traces
          endpoint: minio.storage.svc.cluster.local:9000
          access_key: admin
          secret_key: MultiCloudSecurePassword2026!
          insecure: true
          forcepathstyle: true

