apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (ADR-0005)
    policies.kyverno.io/severity: High
    policies.kyverno.io/description: >-
      Bắt buộc tắt cờ allowPrivilegeEscalation để ngăn chặn tiến trình con giành thêm đặc quyền.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: "target-namespaces"
      expression: "object.metadata.namespace in ['teastore', 'monitoring']"
    - name: "exclude-teastore-db"
      expression: "!object.metadata.name.startsWith('teastore-db')"
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false
        )
      message: "allowPrivilegeEscalation bắt buộc phải được đặt là false."
