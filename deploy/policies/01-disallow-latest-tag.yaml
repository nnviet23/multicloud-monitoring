apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag & Require Strict Version Pinning
    policies.kyverno.io/category: Supply Chain Security (ADR-0002, ADR-0005)
    policies.kyverno.io/severity: High
    policies.kyverno.io/description: >-
      Chặn các container sử dụng tag 'latest' hoặc không chỉ định tag cụ thể.
      Bắt buộc ghim cứng phiên bản cụ thể hoặc sử dụng mã băm OCI digest (@sha256).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: "target-namespaces"
      expression: "object.metadata.namespace in ['teastore', 'monitoring', 'storage']"
  validations:
    - expression: >-
        object.spec.containers.all(c, !c.image.endsWith(':latest') || c.image.startsWith('cgr.dev/chainguard/minio:')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !c.image.endsWith(':latest') || c.image.startsWith('cgr.dev/chainguard/minio:')))
      message: "Sử dụng tag 'latest' hoặc không có tag bị cấm theo ADR-0002. Hãy ghim phiên bản cụ thể hoặc digest."
