apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
  annotations:
    policies.kyverno.io/title: "Default Deny All Ingress and Egress (monitoring)"
    policies.kyverno.io/category: "Network Security (SEC-03)"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-traffic
  namespace: monitoring
  annotations:
    policies.kyverno.io/title: "Allow Monitoring Stack Traffic"
    policies.kyverno.io/category: "Network Security (SEC-03)"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        # OTLP gRPC & HTTP
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        # Prometheus / Thanos Query
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 10901
        - protocol: TCP
          port: 10902
        # OTel Collector internal metrics & Prometheus exporter
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
        # Grafana
        - protocol: TCP
          port: 3000
        # Loki
        - protocol: TCP
          port: 3100
        # Tempo
        - protocol: TCP
          port: 3200
        # Alertmanager
        - protocol: TCP
          port: 9093
        # Pyrra
        - protocol: TCP
          port: 9099
        # Robusta webhook (Alertmanager -> Robusta)
        - protocol: TCP
          port: 5000
  egress:
    # CoreDNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Monitoring & Storage service ports + Robusta/K8s API/Telegram HTTPS
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 10901
        - protocol: TCP
          port: 10902
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9099
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        # Azure MySQL receiver & Spoke kubeletstats
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 10250
        # AI Anomaly Engine Prometheus exporter
        - protocol: TCP
          port: 9108
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: storage
  annotations:
    policies.kyverno.io/title: "Default Deny All Ingress and Egress (storage)"
    policies.kyverno.io/category: "Network Security (SEC-03)"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-traffic
  namespace: storage
  annotations:
    policies.kyverno.io/title: "Allow MinIO Storage Traffic"
    policies.kyverno.io/category: "Network Security (SEC-03)"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: TCP
          port: 9001
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
