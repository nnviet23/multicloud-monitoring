apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-health-probes
  annotations:
    policies.kyverno.io/title: Require Readiness and Liveness Probes
    policies.kyverno.io/category: High Availability & SRE (ADR-0005, ADR-0010)
    policies.kyverno.io/severity: High
    policies.kyverno.io/description: >-
      Bắt buộc các microservices phải cấu hình readinessProbe và livenessProbe
      để đảm bảo lưu lượng chỉ gửi tới Pod khỏe mạnh.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: "target-namespaces"
      expression: "object.metadata.namespace == 'teastore'"
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.readinessProbe) &&
          has(c.livenessProbe)
        )
      message: "Mọi Pod trong namespace teastore bắt buộc phải có readinessProbe và livenessProbe."
