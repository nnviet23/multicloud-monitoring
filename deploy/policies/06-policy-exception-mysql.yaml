apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: teastore-mysql-privilege-escalation-exception
  namespace: teastore
spec:
  policyRefs:
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
  matchConditions:
    - name: "teastore-db-pod"
      expression: "object.metadata.namespace == 'teastore' && object.metadata.name.startsWith('teastore-db')"
