apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: teastore-mysql-privilege-escalation-exception
  namespace: teastore
spec:
  exceptions:
    - policyName: disallow-privilege-escalation
      ruleNames:
        - check-privilege-escalation
  match:
    any:
      - resources:
          kinds:
            - Pod
          names:
            - teastore-db*
          namespaces:
            - teastore
