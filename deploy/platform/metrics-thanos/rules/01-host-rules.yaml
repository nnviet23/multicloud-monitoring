groups:
- name: host-rules
  rules:
  - alert: HostHighCpuLoad
    expr: 1 - (avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
      > .80
    for: 10m
    labels:
      severity: warning
      category: compute
    annotations:
      summary: Host high CPU load (instance {{ $labels.instance }})
      description: "CPU load is > 80% on instance {{ $labels.instance }}.\n  VALUE\
        \ = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostCpuStealNoisyNeighbor
    expr: avg without (cpu) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.10
    for: 5m
    labels:
      severity: warning
      category: compute
    annotations:
      summary: Host CPU steal noisy neighbor (instance {{ $labels.instance }})
      description: "CPU steal is > 10% on instance {{ $labels.instance }}.\n  VALUE\
        \ = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostCpuHighIowait
    expr: avg without (cpu) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.15
    for: 5m
    labels:
      severity: warning
      category: storage
    annotations:
      summary: Host CPU high iowait (instance {{ $labels.instance }})
      description: "CPU iowait is > 15% on instance {{ $labels.instance }}.\n  VALUE\
        \ = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostOutOfMemory
    expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < .10)
    for: 2m
    labels:
      severity: warning
      category: memory
    annotations:
      summary: Host out of memory (instance {{ $labels.instance }})
      description: "Node memory is filling up (< 10% left).\n  VALUE = {{ $value }}\n\
        \  LABELS = {{ $labels }}"
  - alert: HostMemoryUnderMemoryPressure
    expr: (rate(node_vmstat_pgmajfault[1m]) > 1000)
    for: 2m
    labels:
      severity: warning
      category: memory
    annotations:
      summary: Host memory under memory pressure (instance {{ $labels.instance }})
      description: "The node is under heavy memory pressure with high major page faults.\n\
        \  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostOutOfDiskSpace
    expr: (node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"} / node_filesystem_size_bytes
      < .10 and on (instance, device, mountpoint) node_filesystem_readonly == 0)
    for: 2m
    labels:
      severity: critical
      category: storage
    annotations:
      summary: Host out of disk space (instance {{ $labels.instance }})
      description: "Disk is almost full (< 10% left) on mountpoint {{ $labels.mountpoint\
        \ }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostOutOfInodes
    expr: (node_filesystem_files_free{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"} / node_filesystem_files
      < .10 and on (instance, device, mountpoint) node_filesystem_readonly == 0)
    for: 2m
    labels:
      severity: critical
      category: storage
    annotations:
      summary: Host out of inodes (instance {{ $labels.instance }})
      description: "Disk inodes almost exhausted (< 10% left) on {{ $labels.mountpoint\
        \ }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostDiskMayFillIn24Hours
    expr: (node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"} / node_filesystem_size_bytes
      < .40 and predict_linear(node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"}[1h],
      86400) < 0 and on (instance, device, mountpoint) node_filesystem_readonly ==
      0)
    for: 15m
    labels:
      severity: warning
      category: storage
    annotations:
      summary: Host disk may fill in 24 hours (instance {{ $labels.instance }})
      description: "Disk is predicted to fill within 24 hours on {{ $labels.mountpoint\
        \ }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostSwapIsFillingUp
    expr: ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / (node_memory_SwapTotal_bytes)
      * 100 > 80) and (node_memory_SwapTotal_bytes > 0)
    for: 2m
    labels:
      severity: warning
      category: memory
    annotations:
      summary: Host swap is filling up (instance {{ $labels.instance }})
      description: "Swap is over 80% full.\n  VALUE = {{ $value }}\n  LABELS = {{\
        \ $labels }}"
  - alert: HostSystemdServiceCrashed
    expr: (node_systemd_unit_state{state="failed"} == 1)
    for: 0m
    labels:
      severity: warning
      category: systemd
    annotations:
      summary: Host systemd service crashed (instance {{ $labels.instance }})
      description: "systemd service {{ $labels.name }} crashed on instance {{ $labels.instance\
        \ }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostOomKillDetected
    expr: (increase(node_vmstat_oom_kill[1m]) > 0)
    for: 0m
    labels:
      severity: warning
      category: memory
    annotations:
      summary: Host OOM kill detected (instance {{ $labels.instance }})
      description: "OOM kill detected on instance {{ $labels.instance }}.\n  VALUE\
        \ = {{ $value }}\n  LABELS = {{ $labels }}"
  - alert: HostRebooted
    expr: changes(node_boot_time_seconds[5m]) > 0
    for: 0m
    labels:
      severity: warning
      category: system
    annotations:
      summary: Host rebooted (instance {{ $labels.instance }})
      description: Node {{ $labels.instance }} rebooted within the last 5 minutes.
