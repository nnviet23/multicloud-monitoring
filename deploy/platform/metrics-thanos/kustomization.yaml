apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 01-configmap-prometheus.yaml
  - 02-pvc.yaml
  - 03-statefulset-prometheus.yaml
  - 04-service-prometheus.yaml
  - 05-deployment-thanos-query.yaml
  - 06-service-thanos-query.yaml
  - 07-deployment-thanos-store.yaml
  - 08-service-thanos-store.yaml
  - 09-statefulset-thanos-compact.yaml

configMapGenerator:
  - name: prometheus-rules
    namespace: monitoring
    files:
      - rules/01-host-rules.yaml
      - rules/02-kubernetes-rules.yaml
      - rules/03-mysql-rules.yaml
      - rules/04-jvm-rules.yaml
      - rules/05-wan-network-rules.yaml
      - rules/06-thanos-rules.yaml
      - rules/07-cert-manager-rules.yaml
      - rules/08-opentelemetry-collector-rules.yaml
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: thanos-objstore-secret
    namespace: monitoring
    files:
      - objstore.yml
    options:
      disableNameSuffixHash: true
