apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-spoke
  namespace: monitoring
  labels:
    app: otel-collector-spoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-spoke
  template:
    metadata:
      labels:
        app: otel-collector-spoke
    spec:
      serviceAccountName: otel-collector-spoke
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CLUSTER_NAME
              value: "spoke-cluster"
            - name: CLOUD_PROVIDER
              value: "spoke-cloud"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.cluster.name=spoke-cluster,cloud.provider=spoke-cloud,deployment.environment.name=production"
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: certs
              mountPath: /etc/otelcol/certs
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: internal-prom
            - containerPort: 8889
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-spoke-config
        - name: certs
          secret:
            secretName: otel-spoke-certs
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: tmp
          emptyDir: {}
