apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-spoke-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      hostmetrics:
        collection_interval: 15s
        scrapers:
          cpu:
          load:
          memory:
          paging:
          disk:
          filesystem:
          network:

      filelog:
        include:
          - /var/log/pods/teastore_*/*/*.log
        start_at: beginning
        include_file_path: true
        operators:
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) (?P<log>.*)$'
            output: extract_metadata_from_filepath
          - type: regex_parser
            id: extract_metadata_from_filepath
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_[a-f0-9\-]+/(?P<container_name>[^/]+)/.*$'
            output: move_body
          - type: move
            id: move_body
            from: attributes.log
            to: body

      prometheus/internal:
        config:
          scrape_configs:
            - job_name: 'otel-collector-edge-internal'
              scrape_interval: 10s
              static_configs:
                - targets: ['127.0.0.1:8888']

      kubeletstats:
        collection_interval: 10s
        auth_type: "serviceAccount"
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: false
        metric_groups:
          - node
          - pod
          - container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      filter/drop_noise:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(attributes["url.path"], ".*/isready.*")'
            - 'IsMatch(attributes["url.path"], ".*/finished.*")'
            - 'IsMatch(attributes["http.target"], ".*/status.*")'
        logs:
          log_record:
            - 'IsMatch(body, ".*GET /ready/isready.*200.*")'
            - 'IsMatch(body, ".*GET /image/finished.*200.*")'

      tail_sampling:
        decision_wait: 2s
        num_traces: 2000
        expected_new_traces_per_sec: 100
        policies:
          - name: errors-policy
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: high-latency-policy
            type: latency
            latency: { threshold_ms: 1500 }
          - name: normal-probabilistic-policy
            type: probabilistic
            probabilistic: { sampling_percentage: 20 }

      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false

      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.node.uid
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.container.name
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      filter/logs:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number > 0 and severity_number < SEVERITY_NUMBER_INFO'


      groupbyattrs:
        keys:
          - container_name
          - pod_name
          - namespace

      transform/logs:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["container_name"]) where attributes["service.name"] == nil and attributes["container_name"] != nil
              - set(attributes["k8s.pod.name"], attributes["pod_name"]) where attributes["pod_name"] != nil
              - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil

      transform/cluster_id:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")
        trace_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")
        metric_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${CLUSTER_NAME}")
              - set(attributes["cloud.provider"], "${CLOUD_PROVIDER}")
              - set(attributes["cloud.region"], "${CLOUD_REGION}")
              - set(attributes["deployment.environment.name"], "production")

      batch:
        send_batch_size: 512
        timeout: 1s

    exporters:
      otlp/hub:
        endpoint: hub-gateway.hub.multicloud.local:4317
        compression: gzip
        tls:
          ca_file: /etc/otelcol/certs/ca.crt
          cert_file: /etc/otelcol/certs/tls.crt
          key_file: /etc/otelcol/certs/tls.key
          min_version: "1.3"
          insecure_skip_verify: false

      debug:
        verbosity: basic

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_noise, tail_sampling, resourcedetection, k8sattributes, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, filter/logs, filter/drop_noise, resourcedetection, k8sattributes, groupbyattrs, transform/logs, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
        metrics:
          receivers: [otlp, hostmetrics, kubeletstats, prometheus/internal]
          processors: [memory_limiter, resourcedetection, k8sattributes, transform/cluster_id, batch]
          exporters: [otlp/hub, debug]
