apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-runner
  namespace: monitoring
  labels:
    app: robusta-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robusta-runner
  template:
    metadata:
      labels:
        app: robusta-runner
    spec:
      serviceAccountName: robusta-runner-service-account
      containers:
        - name: runner
          image: robustadev/robusta-runner:0.53.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROBUSTA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PLAYBOOKS_CONFIG_FILE_PATH
              value: "/etc/robusta/config/active_playbooks.yaml"
            - name: INTERNAL_PLAYBOOKS_ROOT
              value: "/etc/robusta/playbooks/defaults"
            - name: ENABLE_TELEMETRY
              value: "false"
            - name: TRACE_INCOMING_ALERTS
              value: "false"
            - name: TRACE_INCOMING_REQUESTS
              value: "false"
            - name: LOG_LEVEL
              value: "INFO"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: robusta-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: robusta-secrets
                  key: TELEGRAM_CHAT_ID
            - name: ROBUSTA_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: robusta-secrets
                  key: ROBUSTA_SIGNING_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/robusta/config
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: robusta-config
        - name: tmp
          emptyDir: {}