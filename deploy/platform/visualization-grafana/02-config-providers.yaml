apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'MultiCloud Static Dashboards'
        orgId: 1
        folder: 'Multi-Cloud Observability'
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/static
      - name: 'MultiCloud Dynamic Dashboards'
        orgId: 1
        folder: 'Multi-Cloud Observability'
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/integrations
