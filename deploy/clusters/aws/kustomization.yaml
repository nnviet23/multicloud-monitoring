apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Policies
  - ../../policies
  # Benchmark Workloads
  - ../../../workloads/teastore/aws-spoke
  # Platform
  - ../../platform/otel-collector/edge
  - ../../platform/sealed-secrets

patches:
  - path: patches/patch-cluster-identity.yaml

# Release Pointers - Managed via release-images.yaml (ADR-0001 & ADR-0002)
images:
  - name: descartesresearch/teastore-auth
    newName: descartesresearch/teastore-auth
    newTag: "1.4.1"
  - name: descartesresearch/teastore-image
    newName: descartesresearch/teastore-image
    newTag: "1.4.1"
  - name: descartesresearch/teastore-recommender
    newName: descartesresearch/teastore-recommender
    newTag: "1.4.1"
  - name: descartesresearch/teastore-registry
    newName: descartesresearch/teastore-registry
    newTag: "1.4.1"
  - name: descartesresearch/teastore-webui
    newName: descartesresearch/teastore-webui
    newTag: "1.4.1"
  - name: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
    newName: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
    newTag: "2.10.0"
  - name: otel/opentelemetry-collector-contrib
    newName: otel/opentelemetry-collector-contrib
    newTag: "0.114.0"
  - name: bitnami/sealed-secrets-controller
    newName: bitnami/sealed-secrets-controller
    newTag: "v0.24.5"
